<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071820">
  <title>Школа информационной безопасности — видео</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #071820; color: #f4f7f8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: min(1100px, 100%); }
    h1 { margin: 0 0 18px; font-size: clamp(1.25rem, 3vw, 2rem); text-align: center; }
    video {
      display: block; width: 100%; height: auto; max-height: 82vh;
      background: #000; border-radius: 12px; box-shadow: 0 16px 48px #0008;
    }
    p { margin: 14px 0 0; color: #b9cbd0; text-align: center; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Школа информационной безопасности</h1>
    <video controls playsinline preload="metadata" poster="poster.png">
      <source src="video.mp4" type="video/mp4">
      Ваш браузер не поддерживает воспроизведение видео MP4.
      <a href="video.mp4">Открыть видео</a>
    </video>
    <p>Видео проекта «Школа информационной безопасности»</p>
  </main>
</body>
</html>
